name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # 公開側の repo と手動の実行だけで動かす(E2E は含めない)
    if: github.repository == 'AnalyticsDesign/ab-test-and-target-harness' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 固まったときに既定の 6 時間まで待たないための上限。CI での実測(非公開の repo の runner)の 1.5〜2 倍を 5 分単位に切り上げる。
    # 2026-11-02 の実測: test 24 分 38 秒、全体 約 26 分(control のテストが 1427 秒。手元の約 4.6 倍)→ 45 分
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm の版は package.json の packageManager から読む
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:check
